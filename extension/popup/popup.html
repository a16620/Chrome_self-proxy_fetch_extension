<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, sans-serif;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .enable-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      white-space: nowrap;
    }
    #mode-select {
      flex-shrink: 0;
      padding: 4px 6px;
      font-size: 12px;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 13px;
    }

    h4 {
      margin: 0 0 8px;
      font-size: 11px;
    }

    #current-script-not-available {
      text-align: center;
      border-radius: 4px;
      padding: 5px 0px 5px 0px;;

      color: white;
      background-color: crimson;
    }

    button {
      border-radius: 4px;
      border: none;
    }

    #toggle-current-btn {
      width: 100%;
      padding: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    #toggle-current-btn.add {
      background: #2e7d32;
      color: white;
    }
    #toggle-current-btn.remove {
      background: #c62828;
      color: white;
    }
    ul#whitelist {
      list-style: none;
      padding: 0;
      margin: 8px 0 0;
      max-height: 200px;
      overflow-y: auto;
    }
    ul#whitelist li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-bottom: 1px solid #eee;
      font-size: 11px;
      font-family: monospace;
    }
    ul#whitelist li span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    ul#whitelist li button {
      flex-shrink: 0;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 11px;
    }
    #empty-msg {
      font-size: 12px;
      color: #888;
      padding: 8px 0;
    }

    p {
      white-space: nowrap;
      margin: 0px;
    }

    input {
      width: stretch;
    }

    #button-api-register {
      white-space: nowrap;
      width: fit-content;
      padding: 3px 10px 3px 10px;
      cursor: pointer;
      font-size: 13px;

      background: #2e7d32;
      color: white;
    }

    .button-reset {
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
      
      color: darkgrey;
      font-size: 13px;
    }

    .button-reset:hover {
      color: grey;
      outline: none;
    }

  </style>
</head>
<body>
  <h2 style="margin: 0px;">API CORS 우회 호출 프로그램</h2>
  <h3 style="margin-top: 10px;">프로그램 설정</h3>
  <div class="settings-row">
    <label class="enable-label">
      <input type="checkbox" id="enable-toggle">
      <p id="enable-label-text">활성화</p>
    </label>
    <div class="settings-row">
      <p>작동 모드:</p>
      <select id="mode-select">
        <option value="container">추가 fetch 등록</option>
        <option value="override">기본 fetch 덮어쓰기</option>
      </select>
    </div>
  </div>
  <div id="div-extension-namespace" class="settings-row">
    <p>네임스페이스: </p>
    <input id="input-extension-namespace" placeholder="myAPI">
  </div>
  <hr>
  <div class="settings-row">
      <h3>현재 페이지에 권한 부여</h3>
    <a role="button" id="button-reset-file-list" class="button-reset">모두 해제</a>
  </div>
  <div id="current-script-not-available">사용 불가능한 페이지</div>
  <button id="toggle-current-btn"></button>
  <hr>
  <div class="settings-row">
    <h3 style="margin-top: 10px;">API 화이트리스트</h3>
    <a role="button" id="button-reset-api-list" class="button-reset">초기화</a>
  </div>
  <div class="settings-row">
    <p>API 주소:</p>
    <input id="input-api-register">
    <button id="button-api-register">등록</button>
  </div>
  <h3 style="margin-top: 5px;">목록</h3>
  <div id="empty-msg" style="display: none;">등록된 경로가 없습니다.</div>
  <ul id="whitelist"></ul>

  <script src="popup.js"></script>
</body>
</html>
